
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: Go Vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

  cross-build:
    name: Cross-platform build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: Cross-compile
        shell: bash
        run: |
          mkdir -p bin
          for os in freebsd linux; do
            for arch in amd64 arm64; do
              echo "Building $os/$arch..."
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath \
                -ldflags="-s -w" \
                -o "bin/wsd-gateway-$os-$arch" .
            done
          done
