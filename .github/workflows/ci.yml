name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test -race ./...
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Cross-compile
        shell: bash
        run: |
          mkdir -p bin
          for os in freebsd linux; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
                -ldflags="-s -w" -o "bin/wsd-gateway-$os-$arch" .
            done
          done
